<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" href="/assets/favicon.png" type="favicon" />
        <title>KeyCraft Studio</title>
        <link rel="stylesheet" href="/css/styles.css" />
        <link rel="stylesheet" href="/css/index.css" />
        <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    </head>
    <body>

        <!--Aqui procede el header :D-->

        <header class="header">
            <div class="header-left">
                <div class="logo-container" id="inicio"">
                    <img src="/assets/favicon.png" />
                    <!--Cambiar al logo-->
                </div>
            </div>
                <div class="header-right">
                <div class="search-container">
                    <input type="search" placeholder="Buscar..." class="search-input" />
                    <button class="search-button">
                        <span class="material-symbols-outlined iconos lupita">search</span>
                    </button>
                </div>
                <div class="nav-container">
                    <input type="checkbox" id="menu-toggle" class="menu-toggle" />
                    <label class="btn-menu" for="menu-toggle">
                        <span class="material-symbols-outlined iconos">menu</span>
                    </label>
                    <nav class="nav" id="menu-toggle">
                        <ul class="nav-ul">
                            <li class="items">
                                <div class="item-container">
                                    <span class="material-symbols-outlined iconos">home</span>
                                    <a href="#inicio" class="links">Inicio</a>
                                </div>
                            </li>
                            <li class="items">
                                <div class="item-container">
                                    <span class="material-symbols-outlined iconos">Local_Mall</span>
                                    <a href="#" class="links">Productos</a>
                                </div>
                            </li>
                            <li class="items">
                                <div class="item-container">
                                    <span class="material-symbols-outlined iconos">Contact_Support</span>
                                    <a href="#" class="links">Soporte</a>
                                </div>
                            </li>
                        </ul>
                    </nav>
                </div>
                <div class="car-container">
                    <a href="#carrito" class="car-link">
                        <span class="material-symbols-outlined iconos carrito">shopping_cart</span>
                    </a>
                </div>
            </div>
        </header>
        <section class="banner">
            <div class="banner-container">
                <h1 class="banner-title">Bienvenido a KeyCraft Studio</h1>
                <p class="banner-description">Tu destino para productos de calidad y soporte excepcional.</p>
                <a href="#productos" class="banner-button">Explorar Productos</a>
            </div>
        </section>
        <aside class="category">

        </aside>
    </body>
</html>
